[package]
name = "codex-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Switchyard adapter for OpenAI Codex: maps `codex app-server` JSON-RPC onto the adapter protocol."

[dependencies]
adapter-protocol = { path = "../adapter-protocol" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
