name: adapter protocol

on:
  push:
    paths:
      - "crates/adapter-protocol/**"
      - ".github/workflows/protocol.yml"
  pull_request:
    paths:
      - "crates/adapter-protocol/**"
      - ".github/workflows/protocol.yml"

jobs:
  conformance:
    name: conformance (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p adapter-protocol -- --check
      - name: Clippy
        run: cargo clippy -p adapter-protocol --all-targets -- -D warnings
      - name: Conformance suite
        run: cargo test -p adapter-protocol
