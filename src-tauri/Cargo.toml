[package]
name = "switchyard-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Switchyard desktop shell: hosts switchyard-core and bridges its command/event stream over Tauri IPC."

[[bin]]
name = "switchyard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
switchyard-core.workspace = true
switchyard-schema.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
