[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"
switchyard-schema = { path = "crates/switchyard-schema" }
switchyard-core = { path = "crates/switchyard-core" }
