[package]
name = "adapter-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Switchyard adapter protocol: versioned events and commands, plus a recorded-fixture conformance runner."

[dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
