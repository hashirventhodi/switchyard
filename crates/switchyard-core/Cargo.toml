[package]
name = "switchyard-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Switchyard core: processes, git, policy, store, session state machine. Contains no Tauri types."

[dependencies]
switchyard-schema.workspace = true
adapter-protocol = { path = "../adapter-protocol" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
