name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Core and schema tests (everything except the Tauri app; the Claude Code conformance test runs the sidecar under Node)
        run: cargo test --workspace --exclude switchyard-app
      - name: Core has no Tauri dependency
        run: |
          if cargo tree -p switchyard-core -e normal,build | grep -i tauri; then
            echo "switchyard-core must not depend on Tauri (ADR-0001)"; exit 1
          fi
      - name: Generated TypeScript is committed and current
        run: git diff --exit-code -- ui/src/schema

  clippy:
    # Temporary until #52: clippy at -D warnings on the lines a change adds or modifies only,
    # so the existing warnings don't block it. #52 clears them and replaces this job with
    # `cargo clippy --workspace --exclude switchyard-app --all-targets -- -D warnings`.
    name: Clippy on changed lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # A PR is compared with its base branch; a push to main with the main it replaced
      # (HEAD^ when that commit is gone, e.g. after a force-push); any other push with main.
      - name: Clippy -D warnings on lines changed since the base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            base="$BEFORE"
            git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD^
          else
            base=origin/main
          fi
          scripts/clippy-changed-lines.py "$base"

  renderer:
    name: Renderer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  app:
    name: App build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the app
        run: pnpm tauri build --no-bundle
